[Hero]
; Scale affects presentation, movement and hook distances; applies next activation.
WorldScale=70

[HeroStats]
; Base AoTTG stats, applies next activation; presets and sliders in Hero settings.
Blade=75
Gas=75
Speed=125
Acceleration=135

[Controls]
; Keyboard = DirectInput scan code, mouse = 256 + button index, -1 = unbound.
; Configure named keys / key capture in F1 -> AottgInSkyrim -> Controls.
Toggle=66
Forward=17
Back=31
Left=30
Right=32
Jump=42
Dash=57
Dodge=29
HookLeft=16
HookRight=18
HookBoth=258
Attack=256
Skill=46
SkillAlternate=257
CycleSkill=47
Reload=19
Supply=48
ReelIn=29
ReelOut=56
Interact=33
Shout=44
MouseWheelReel=1
InvertWheel=1

[Camera]
; Third person camera. FieldOfView is vertical degrees; settings apply live.
Sensitivity=0.15
Distance=0.3
Height=0.64
BaseDistance=10
CollisionRadius=0.1
FieldOfView=50
InvertY=0
Tilt=1
Obstruction=1
DynamicFov=1

[Movement]
; Movement / resources / hooks apply next activation.
SpeedMultiplier=1
AccelerationMultiplier=1
GravityMultiplier=1
JumpMultiplier=1
DashMultiplier=1
DoubleTapWindow=0.2
DoubleTapDash=1
AutoWallJump=0
NoForcedToRoof=0
NoStopJump=0

[Hooks]
PullMultiplier=1
Range=10000
ProjectileSpeed=150

[Equipment]
BladeHitboxMultiplier=1
GasCapacityMultiplier=1
GasUseMultiplier=1
BladeCapacityMultiplier=1
SpareBladePairs=5
InfiniteGas=0
; Damage / combat switches apply live.
; Relative speed / world scale * 10 * multiplier; minimum 10.
DamageMultiplier=1
Combat=1

[Presentation]
HeroHud=1
Crosshair=1
CrosshairDistance=1
CrosshairArrows=1
Speedometer=1
CrosshairStyle=0
DamageHud=1
KillInfo=1
ShowRopes=1
; 3 renders each rope at three times the original one-pixel width.
RopeThicknessMultiplier=3
AutoRestore=1
Notifications=1
ProceduralPose=1

[Development]
; Short movement/camera history dumped whenever HERO automatically restores the player.
RestoreDiagnostics=1
; Automated isolated world check. Leave disabled for ordinary play.
GameplayCheck=0
